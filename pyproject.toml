[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "screwpick"
version = "0.1.0"
description = "Raspberry Pi pick-and-place screw sorter on a Klipper printer (Ender 3, Prusa MK3)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.24",
]
# OpenCV is not listed: the Pi gets opencv-contrib-python-headless from requirements-pi.txt, the
# PC usually has opencv-contrib-python already, and two OpenCV packages overwrite each other.

[project.optional-dependencies]
# the printer menu buttons (Klipper -> Moonraker -> screwpick) need a websocket
klipper = ["websocket-client>=1.6"]
# printable Gridfinity bins and baseplates
print = ["trimesh>=4.0", "manifold3d>=3.0"]
dev = ["pytest>=8.0", "ruff>=0.6", "trimesh>=4.0", "manifold3d>=3.0", "websocket-client>=1.6"]

[project.scripts]
screwpick = "screwpick.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/screwpick"]

[tool.hatch.build.targets.wheel.force-include]
"src/screwpick/web/index.html" = "screwpick/web/index.html"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: needs the camera, the model or a printer (deselect with -m \"not slow\")",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["screwpick"]
known-third-party = ["screwsynth", "screwrig"]
