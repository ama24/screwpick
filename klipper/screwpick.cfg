# screwpick: Klipper side. Copy this file next to printer.cfg (~/printer_data/config/) and add
#   [include screwpick.cfg]
# to printer.cfg, then FIRMWARE_RESTART. The picker itself is in screwpick_picker.cfg (Setup tab).

# ---------------------------------------------------------------- which tool is mounted
# The sorter only moves when tool = "picker". Run TOOL_PICKER after mounting the picker,
# TOOL_HOTEND after putting the hotend back. The choice survives restarts (save_variables).
[save_variables]
filename: ~/printer_data/config/screwpick_variables.cfg

[gcode_macro _SCREWPICK_TOOL]
variable_tool: "hotend"
gcode:
  RESPOND MSG="screwpick: active tool is {printer['gcode_macro _SCREWPICK_TOOL'].tool}"

[delayed_gcode _SCREWPICK_RESTORE_TOOL]
initial_duration: 1
gcode:
  {% set saved = printer.save_variables.variables.screwpick_tool|default("hotend") %}
  SET_GCODE_VARIABLE MACRO=_SCREWPICK_TOOL VARIABLE=tool VALUE='"{saved}"'

[gcode_macro TOOL_PICKER]
description: The picker is mounted (heaters off, sorting allowed)
gcode:
  TURN_OFF_HEATERS
  SET_GCODE_VARIABLE MACRO=_SCREWPICK_TOOL VARIABLE=tool VALUE='"picker"'
  SAVE_VARIABLE VARIABLE=screwpick_tool VALUE='"picker"'
  RESPOND MSG="screwpick: picker mounted"

[gcode_macro TOOL_HOTEND]
description: The hotend is mounted (printing allowed, sorting refused)
gcode:
  SCREWPICK_RELEASE
  SET_GCODE_VARIABLE MACRO=_SCREWPICK_TOOL VARIABLE=tool VALUE='"hotend"'
  SAVE_VARIABLE VARIABLE=screwpick_tool VALUE='"hotend"'
  RESPOND MSG="screwpick: hotend mounted"

# ---------------------------------------------------------------- homing
# G28 never runs into a bin: lift first, home X and Y, then home Z with the tool over the middle
# of the working area (flat TPU plate, no bins), then lift again. screwpick sets z_home_x/y from
# the layout before it homes; the values below are only used when you home by hand.
# Remove any [safe_z_home] section from printer.cfg: Klipper allows only one of the two.
# The lift counts from wherever Z is (it is unknown before homing): keep the head below
# (Z max - lift) when switching off, e.g. at the photo position.
[gcode_macro _SCREWPICK_HOME]
variable_z_home_x: 110        # toolhead X over the middle of the working area
variable_z_home_y: 110
variable_lift: 30             # mm: more than the bins are tall
gcode:
  RESPOND MSG="screwpick: Z homes at X{printer['gcode_macro _SCREWPICK_HOME'].z_home_x} Y{printer['gcode_macro _SCREWPICK_HOME'].z_home_y}"

[homing_override]
axes: xyz
set_position_z: 0
gcode:
  {% set h = printer["gcode_macro _SCREWPICK_HOME"] %}
  {% set all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
  {% set homed = printer.toolhead.homed_axes %}
  G90
  G1 Z{h.lift} F600
  {% if all or 'X' in params or ('Z' in params and 'x' not in homed) %}
    G28 X
  {% endif %}
  {% if all or 'Y' in params or ('Z' in params and 'y' not in homed) %}
    G28 Y
  {% endif %}
  {% if all or 'Z' in params %}
    G1 X{h.z_home_x} Y{h.z_home_y} F6000
    G28 Z
    G1 Z{h.lift} F600
  {% endif %}

# If the picker tip reaches lower than the nozzle did, see "Homing" in docs/reference.md: the Z
# switch is raised so it triggers with the tip above the plate, and Z may then go a little
# below 0 during a pick, e.g. in printer.cfg:  [stepper_z]  position_min: -5

# ---------------------------------------------------------------- printer menu -> screwpick
# The screwpick program on the Pi receives these through Moonraker.
[gcode_macro SCREWPICK]
description: Send a command to the sorter (CMD=auto|start|step|pause|resume|stop|ok STRATEGY=sort|clear|kit)
gcode:
  {% set cmd = params.CMD|default("start")|lower %}
  {% set strategy = params.STRATEGY|default("")|lower %}
  {action_call_remote_method("screwpick", command=cmd, strategy=strategy)}
  RESPOND MSG="screwpick: {cmd} {strategy}"

[menu __main __screwpick]
type: list
name: Screw sorter

[menu __main __screwpick __auto]
type: command
name: Automatic
gcode: SCREWPICK CMD=auto STRATEGY=sort

[menu __main __screwpick __sort]
type: command
name: Sort
gcode: SCREWPICK CMD=start STRATEGY=sort

[menu __main __screwpick __clear]
type: command
name: Clear plate
gcode: SCREWPICK CMD=start STRATEGY=clear

[menu __main __screwpick __kit]
type: command
name: Pick kit
gcode: SCREWPICK CMD=start STRATEGY=kit

[menu __main __screwpick __step]
type: command
name: One pick
gcode: SCREWPICK CMD=step

[menu __main __screwpick __ok]
type: command
name: Change bin
gcode: SCREWPICK CMD=ok

[menu __main __screwpick __pause]
type: command
name: Pause
gcode: SCREWPICK CMD=pause

[menu __main __screwpick __resume]
type: command
name: Resume
gcode: SCREWPICK CMD=resume

[menu __main __screwpick __stop]
type: command
name: Stop
gcode: SCREWPICK CMD=stop

[menu __main __screwpick __picker]
type: command
name: Picker mounted
gcode: TOOL_PICKER

[menu __main __screwpick __hotend]
type: command
name: Hotend mounted
gcode: TOOL_HOTEND

# ---------------------------------------------------------------- PICKER HARDWARE
# The picker (servo tweezers, suction cup, magnet or pneumatic tweezers) is wired to the
# Raspberry Pi's own pins and lives in its own file, written by screwpick's Setup tab (Picker,
# "Install in Klipper"). Copy klipper/screwpick_picker.cfg next to this file once, so this
# include finds a file before you have chosen.
[include screwpick_picker.cfg]

# ---------------------------------------------------------------- TWEEZERS ON A STEPPER (optional)
# Instead of the rotation servo of screwpick_picker.cfg, tweezers can turn on a stepper motor.
# Then delete [servo screwpick_turn], SCREWPICK_ROTATE and SCREWPICK_ROT_ZERO from
# screwpick_picker.cfg and uncomment ONE of the two variants below.
# 0 degrees = the jaws close along printer X.
#
# A) The rotation motor on the EXTRUDER driver (unplug the extruder motor, plug the tweezer motor
#    in): the [extruder] section stays as it is, so the hotend still prints after a tool swap.
#    FORCE_MOVE turns it without the "cold extrusion" check. The angle is remembered (also over a
#    restart); set 0 by hand once: Setup tab, Picker, "Set zero" (machine.yaml:
#    picker.rotate_zero: SCREWPICK_ROT_ZERO, picker.rotate_home: null).
#[force_move]
#enable_force_move: True
#
#[gcode_macro SCREWPICK_ROTATE]
#description: Turn the tweezers so their jaws close along ANGLE (deg, 0 = printer X)
#variable_angle: 0.0
#variable_mm_per_deg: 0.0931   # extruder mm per degree of the tweezers: rotation_distance / 360
#                              # x gear ratio (33.5 / 360 = 0.0931 for a direct 1:1 drive)
#gcode:
#  {% set r = printer["gcode_macro SCREWPICK_ROTATE"] %}
#  {% set target = params.ANGLE|default(0)|float %}
#  {% set delta = target - r.angle %}
#  {% if delta|abs > 0.05 %}
#    FORCE_MOVE STEPPER=extruder DISTANCE={delta * r.mm_per_deg} VELOCITY=10
#  {% endif %}
#  SET_GCODE_VARIABLE MACRO=SCREWPICK_ROTATE VARIABLE=angle VALUE={target}
#  SAVE_VARIABLE VARIABLE=screwpick_angle VALUE={target}
#
#[gcode_macro SCREWPICK_ROT_ZERO]
#description: The jaws close along printer X right now: this is 0 degrees
#gcode:
#  SET_GCODE_VARIABLE MACRO=SCREWPICK_ROTATE VARIABLE=angle VALUE=0
#  SAVE_VARIABLE VARIABLE=screwpick_angle VALUE=0
#
#[delayed_gcode _SCREWPICK_RESTORE_ANGLE]
#initial_duration: 1
#gcode:
#  SET_GCODE_VARIABLE MACRO=SCREWPICK_ROTATE VARIABLE=angle VALUE={printer.save_variables.variables.screwpick_angle|default(0)}
#
# B) A spare stepper driver and a small switch (or hall sensor) at 0 degrees: the axis finds 0
#    by itself before every sort (machine.yaml: picker.rotate_home: SCREWPICK_ROT_HOME).
#    Copy the pins from an unused driver of your board.
