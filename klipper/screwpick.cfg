#step_pin: PB3
#dir_pin: PB4
#enable_pin: !PC3
#microsteps: 16
#rotation_distance: 360        # 1 unit = 1 degree with a 1:1 drive (x gear ratio otherwise)
#velocity: 180
#accel: 720
#endstop_pin: ^PA4             # the 0-degree switch
